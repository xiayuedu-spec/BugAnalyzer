[project]
name = "buganalyzer-mcp"
version = "0.1.0"
description = "BugAnalyzer MCP Server —— 远程环境能力层（SSH / 日志 / 知识库检索）"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "paramiko>=3.4",
    "tzdata>=2024.1",  # Windows 等无系统 IANA 时区库的平台需要
]

[project.scripts]
buganalyzer-mcp = "buganalyzer_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buganalyzer_mcp"]
