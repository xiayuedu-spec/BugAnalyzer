[project]
name = "kb-import"
version = "0.1.0"
description = "问题单导出文件（CSV/Excel）→ 案例 Markdown 转换器 + 索引重建"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kb-import = "kb_import.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_import"]
